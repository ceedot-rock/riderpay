<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RiderPay — the agent that can pay</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --line:#30363d; --fg:#e6edf3; --dim:#8b949e; --acc:#58a6ff; --ok:#3fb950; --bad:#f85149; }
  * { box-sizing:border-box; }
  body { background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,sans-serif; margin:0; padding:32px 16px; }
  main { max-width:640px; margin:0 auto; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.sub { color:var(--dim); margin:0 0 24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; margin-bottom:16px; }
  label { display:block; color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.06em; margin-bottom:6px; }
  textarea, input[type=text] { width:100%; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:10px; font:inherit; }
  textarea { min-height:64px; resize:vertical; }
  button { background:var(--acc); color:#04101f; border:0; border-radius:6px; padding:10px 18px; font:inherit; font-weight:600; cursor:pointer; margin-top:10px; }
  button:disabled { opacity:.4; cursor:default; }
  button.ghost { background:transparent; color:var(--acc); border:1px solid var(--acc); }
  pre { background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:12px; overflow:auto; font-size:13px; white-space:pre-wrap; }
  .ok { color:var(--ok); } .bad { color:var(--bad); } .dim { color:var(--dim); }
  a { color:var(--acc); }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .sandbox { display:inline-block; font-size:11px; color:#d29922; border:1px solid #d29922; border-radius:4px; padding:2px 8px; margin-bottom:12px; }
</style>
</head>
<body>
<main>
  <span class="sandbox">PAYPAL SANDBOX ONLY — no real money</span>
  <h1>RiderPay</h1>
  <p class="sub">An AI agent holding a signed Rider credential pays via PayPal — with spending bounds, exact integer-cents math, and signed receipts.</p>

  <div class="card">
    <label for="instruction">Instruction</label>
    <textarea id="instruction">Pay $25 to Acme Corp for invoice #123</textarea>
    <label for="credential" style="margin-top:12px">Rider credential (demo JSON stub)</label>
    <input type="text" id="credential" value='{"agent_id":"demo-agent-1","clearance":"L2","exp":1893456000}'>
    <div class="row">
      <button id="payBtn" onclick="doPay()">Pay</button>
    </div>
  </div>

  <div class="card" id="resultCard" hidden>
    <label>Result</label>
    <pre id="result"></pre>
    <div class="row">
      <a id="approveLink" href="#" target="_blank" rel="noopener" hidden><button class="ghost" type="button">Open PayPal approval</button></a>
      <button id="captureBtn" class="ghost" onclick="doCapture()" hidden>Capture &amp; get receipt</button>
    </div>
  </div>

  <div class="card" id="receiptCard" hidden>
    <label>Signed receipt</label>
    <pre id="receipt"></pre>
  </div>
</main>
<script>
let lastOrder = null;
async function doPay() {
  const btn = document.getElementById('payBtn');
  btn.disabled = true;
  const res = await fetch('/api/pay', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      instruction: document.getElementById('instruction').value,
      credential: document.getElementById('credential').value
    })
  });
  const data = await res.json();
  btn.disabled = false;
  document.getElementById('resultCard').hidden = false;
  document.getElementById('receiptCard').hidden = true;
  const pre = document.getElementById('result');
  pre.textContent = JSON.stringify(data, null, 2);
  pre.className = data.status === 'awaiting_approval' ? 'ok' : (data.status === 'refused' ? 'bad' : '');
  const link = document.getElementById('approveLink');
  const cap = document.getElementById('captureBtn');
  if (data.status === 'awaiting_approval' && data.approve_url) {
    lastOrder = data;
    link.href = data.approve_url;
    link.hidden = false; cap.hidden = false;
  } else { link.hidden = true; cap.hidden = true; lastOrder = null; }
}
async function doCapture() {
  if (!lastOrder) return;
  const btn = document.getElementById('captureBtn');
  btn.disabled = true;
  const res = await fetch('/api/capture', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ order_id: lastOrder.order_id, agent_id: lastOrder.agent_id })
  });
  const data = await res.json();
  btn.disabled = false;
  document.getElementById('receiptCard').hidden = false;
  const pre = document.getElementById('receipt');
  pre.textContent = JSON.stringify(data, null, 2);
  pre.className = data.status === 'captured' ? 'ok' : 'bad';
}
</script>
</body>
</html>
